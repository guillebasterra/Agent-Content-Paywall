[project]
name = "tollgate-server"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "xrpl-py",
  "x402-xrpl==0.3.4",
  "python-frontmatter",
  "pynacl",
  "python-multipart>=0.0.33",
  "psycopg[binary]>=3.3.6",
  "psycopg-pool>=3.3.3",
  "pyjwt[crypto]>=2.15.1",
  "httpx>=0.28.1",
  "stripe>=16.1.0",
  "x402[evm,fastapi]==2.27.0",
  "cdp-sdk==1.53.0",
  "mcp>=2.3",
]

[tool.uv]
package = false
# x402-xrpl 0.3.4 pins fastapi<0.116 and uvicorn<0.31; x402 2.x needs starlette>=1.3.1 and mcp 2
# needs uvicorn>=0.31.1. The XRPL tests cover what the old SDK uses from them.
override-dependencies = ["fastapi>=0.162.0", "uvicorn>=0.31.1"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
