[project]
name = "tollgate-server"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "pydantic",
  "xrpl-py",
  "x402-xrpl==0.3.4",
  "python-frontmatter",
  "pynacl",
  "python-multipart>=0.0.33",
  "psycopg[binary]>=3.3.6",
  "psycopg-pool>=3.3.3",
  "pyjwt[crypto]>=2.15.1",
  "httpx>=0.28.1",
  "stripe>=16.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
