[project]
name = "tollgate-mcp"
version = "0.2.0"
description = "Toll Gate discovery for agents. No wallet: payment goes through Coinbase's payments-mcp."
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=2",
  "httpx",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "anyio"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
