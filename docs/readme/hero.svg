<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Pay-per-read content for AI agents: Claude finds an article, gets an HTTP 402, pays $0.02 in USDC on Base, and receives the full text with a signed receipt.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#EA580C"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#E4E4E0"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="429" rx="20" fill="#FAFAF8" stroke="#E6E6E2"/>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="20" fill="url(#dots)" opacity="0.7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- mark: a gate bar, as on the site -->
    <g transform="translate(64 58) scale(2)">
      <rect x="1" y="4" width="3" height="18" fill="#111"/>
      <rect x="4" y="10" width="5" height="4" fill="#111"/>
      <rect x="9" y="10" width="5" height="4" fill="#EA580C"/>
      <rect x="14" y="10" width="5" height="4" fill="#111"/>
      <rect x="19" y="10" width="5" height="4" fill="#EA580C"/>
    </g>
    <text x="132" y="93" font-size="15" letter-spacing="2" fill="#C2410C" font-weight="600">x402 · USDC ON BASE · MCP</text>

    <text x="64" y="172" font-size="54" font-weight="700" fill="#111" letter-spacing="-1.5">Pay-per-read content for AI agents</text>
    <text x="64" y="216" font-size="22" fill="#5F5F5B">Agents find an article, pay a few cents in USDC, and cite it with a signed receipt.</text>
    <text x="64" y="246" font-size="22" fill="#5F5F5B">Writers get paid on every read, with no wallet of their own.</text>

    <!-- the flow -->
    <g font-size="15">
      <rect x="64" y="300" width="232" height="72" rx="14" fill="#fff" stroke="#D9D9D6"/>
      <text x="86" y="330" font-size="18" font-weight="600" fill="#111">Claude asks</text>
      <text x="86" y="354" fill="#6B6B6B">search_catalog over MCP</text>

      <line x1="300" y1="336" x2="342" y2="336" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="344" y="300" width="232" height="72" rx="14" fill="#fff" stroke="#D9D9D6"/>
      <text x="366" y="330" font-size="18" font-weight="600" fill="#111">HTTP 402</text>
      <text x="366" y="354" fill="#6B6B6B">x402 v2 payment challenge</text>

      <line x1="580" y1="336" x2="622" y2="336" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="624" y="300" width="232" height="72" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
      <text x="646" y="330" font-size="18" font-weight="600" fill="#C2410C">$0.02 USDC</text>
      <text x="646" y="354" fill="#9A3412">settled on Base mainnet</text>

      <line x1="860" y1="336" x2="902" y2="336" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="904" y="300" width="232" height="72" rx="14" fill="#111" stroke="#111"/>
      <text x="926" y="330" font-size="18" font-weight="600" fill="#fff">Full text</text>
      <text x="926" y="354" fill="#BDBDB8">+ Ed25519-signed receipt</text>
    </g>
  </g>
</svg>
